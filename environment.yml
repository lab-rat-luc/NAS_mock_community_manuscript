# Unified release environment; reproduction testing pending.
# Historical filtering used SeqKit 2.8.2.
# This release selects SeqKit 2.11.0 throughout.
# Dorado 1.4.0 is installed separately.
name: paper1-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.19
  - pandas=2.3.3
  - numpy=2.2.6
  - seqkit=2.11.0
  - minimap2=2.30
  - samtools=1.22.1
  - pigz
  - r-base=4.5.3
  - r-data.table=1.17.8
  - r-dplyr=1.2.0
  - r-ggplot2=4.0.2
  - r-patchwork=1.3.2
  - r-cowplot=1.2.0
  - r-scales=1.4.0
  - r-tidyr=1.3.2
  - r-ragg=1.5.2
  - r-svglite=2.2.2
  - r-systemfonts=1.3.2
  - r-textshaping=1.0.5
  - r-r.utils=2.13.0
